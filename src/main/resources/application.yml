spring:
  application:
    name: ticketing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticket_booking_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{correlationId}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

jwt:
  secret: ${JWT_SECRET:1142811c5bbf83f925b31b92aa1610037cad2c16ff45138081407099c1a4d2a1}
  expiration-ms: 3600000

app:
  error:
    base-uri: "https://api.ticketing.dev/errors/"
  idempotency:
    expiration-hours: 24

booking:
  hold:
    ttl-minutes: 5