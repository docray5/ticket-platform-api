spring:
  application:
    name: ticketing
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_booking_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{correlationId}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"